# Default configuration for OCT pipeline with undersampling

# Data configuration
data:
  data_path: "0917_2017_18_with_2017_cost.parquet"  # Imbalanced original data (relative to project root)
  file_format: "auto"  # "auto", "csv", or "parquet" (auto detects from extension)
  uid_col: "uid"
  target_col: "highcost_gt_200000"  # Binary outcome column
  exclude_cols_matching: []  # Columns to exclude from feature matching
  exclude_cost_cols: true  # Exclude cost/quarterly columns from features
  exclude_high_corr: true  # Exclude features with high correlation to target
  correlation_threshold: 0.5  # Maximum correlation allowed
  test_size: 0.3
  random_state: 42
  stratify: true  # Use stratified train-test split
  patient_level_split: false  # If true, uses model_pipeline.train_test_split_enrol (patient-level)
  patient_id_col: "ENROLID"  # Patient ID column for patient-level splitting

# Feature configuration
features:
  categorical_cols: []  # Will be auto-detected or specify manually
  numeric_cols: []  # Will be auto-detected or specify manually
  use_model_pipeline_categories: true  # Use model_pipeline.get_bin_flag_columns, etc.
  # Note: binary_group is the same as target_col and is automatically passed to the sampler

# Undersampling configuration
undersampling:
  method: "pushpull"  # Options: "pushpull" or "doublefacility"
  final_ratio: 1.0  # Ratio of controls to cases (1.0 = 1:1)
                    # Can be a single value (e.g., 1.0) or a list for ratio sweeps (e.g., [1, 2, 3, 4, 5])
  w: 0.5  # Weight for multi-objective optimization (0-1)
  K_factor: 3.0  # Node pruning factor (K_factor * |minority|)
  top_k_case_ctrl: 20  # Top-k controls per case for edge pruning
  top_k_ctrl_ctrl: 20  # Top-k controls per control (for doublefacility)
  L_pairs: 10  # Number of far pairs for pushpull
  verbose: true
  
  # Extreme point caching
  save_extreme_points: true
  load_extreme_points: false  # If true, will try to load cached extreme points
  extreme_points_cache_dir: "results/extreme_points"

# OCT training configuration
oct:
  depths: [5, 7]
  minbuckets: [50, 100, 150]
  cps: [0.001, 0.01, 0.05]
  random_seed: 42

# Output configuration
output:
  results_dir: "results"
  save_predictions: true
  save_models: false  # Set to true if you want to save trained models
  metrics_file: null  # null = auto-generate method-specific filename (e.g., metrics_master_pushpull.csv)
                      # Or specify a custom filename to use for all methods

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: true  # Save logs to file
  capture_print: true  # Capture print() statements in log file

